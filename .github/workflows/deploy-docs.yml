name: Deploy Wiki to GitHub Pages

# wiki/ を MkDocs Material でビルドし gh-pages ブランチへ公開する。
#  - main への push  : サイト本体を gh-pages のルートへデプロイ（PR プレビューは保持）
#  - PR の作成/更新   : pr-preview/pr-<N>/ へプレビューをデプロイし、PR にURLをコメント
#  - PR のクローズ    : 対応するプレビューを削除
#
# Pages のソースはリポジトリ設定で
#   Settings → Pages → Build and deployment → Source = "Deploy from a branch"
#   Branch = "gh-pages" / "/ (root)"
# を選択しておくこと。

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "wiki/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write       # gh-pages ブランチへの push 用
  pull-requests: write  # プレビューURLのコメント用
  pages: write          # Pages サイトの有効化（best-effort）用

# 同一 PR / main 単位で直列化（実行中はキャンセルしない）
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PR クローズ時はビルド不要（プレビュー削除のみ）
      - name: Setup Python
        if: github.event.action != 'closed'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pip install -r requirements-docs.txt

      - name: Build site
        if: github.event.action != 'closed'
        run: mkdocs build --site-dir _site

      # main: サイト本体を gh-pages ルートへ。keep_files で pr-preview/ を保持する
      - name: Deploy to GitHub Pages (production)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: true

      # PR: pr-preview/pr-<N>/ へデプロイ/更新/削除し、PR にプレビューURLをコメント
      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./_site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

      # gh-pages ブランチを公開ソースとして Pages を有効化する（best-effort）。
      # 既定の GITHUB_TOKEN は admin 権限を要求され 403 になる場合があり、その際は
      # 手動で Settings → Pages から有効化する必要がある（ビルドは失敗させない）。
      - name: Enable GitHub Pages (best-effort)
        if: github.event.action != 'closed'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "Pages API HTTP status: $code"
          cat /tmp/pages.json || true
          if [ "$code" = "201" ]; then
            echo "::notice::GitHub Pages を gh-pages ブランチで有効化しました。"
          elif [ "$code" = "409" ]; then
            echo "::notice::GitHub Pages は既に有効です。"
          else
            echo "::warning::Pages の自動有効化に失敗（HTTP $code）。Settings → Pages から手動で gh-pages を選択してください。"
          fi
